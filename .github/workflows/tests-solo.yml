name: Tests (Budget à Soi)

# Même filet de sécurité que pour Budget à Deux, mais sur l'app solo (dossier /solo).
# Les deux suites sont indépendantes : chacune a son dossier, ses dépendances et son
# serveur de test. Supabase est bouchonné : aucun test ne touche la vraie base.
on:
  push:
    branches: [main, preview, 'claude/**']
    paths:
      - 'solo/**'
      - '.github/workflows/tests-solo.yml'
  pull_request:
    branches: [main]
    paths:
      - 'solo/**'
      - '.github/workflows/tests-solo.yml'
  # Contrôle hebdomadaire même sans nouveau code : détecte ce qui casse tout seul
  # (image du runner qui évolue, dépendance mise à jour…). Lundi 7h30 UTC.
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: solo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: solo/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Sans --with-deps : l'image ubuntu-latest fournit déjà les bibliothèques
      # système nécessaires à Chromium, et l'installation apt de --with-deps
      # reste bloquée sur une confirmation interactive.
      - name: Installer Chromium
        run: npx playwright install chromium

      - name: Lancer les tests
        run: npx playwright test

      - name: Conserver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright-solo
          path: |
            solo/playwright-report/
            solo/test-results/
          retention-days: 7
