name: Tests

# Filet de sécurité : ces tests tournent sur les flux qu'on ne re-teste pas à la
# main à chaque changement (auth, synchro, calculs de budget, verrouillage).
# Supabase est bouchonné : aucun test ne touche la vraie base.
on:
  push:
    branches: [main, preview, 'claude/**']
  pull_request:
    branches: [main]
  # Contrôle hebdomadaire même sans nouveau code : détecte ce qui casse tout seul
  # (image du runner qui évolue, dépendance mise à jour…). Lundi 7h UTC.
  # À noter : GitHub suspend les workflows planifiés après 60 jours sans activité
  # sur le dépôt, et le réveille au prochain push.
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Sans --with-deps : l'image ubuntu-latest fournit déjà les bibliothèques
      # système nécessaires à Chromium, et l'installation apt de --with-deps
      # reste bloquée sur une confirmation interactive.
      - name: Installer Chromium
        run: npx playwright install chromium

      - name: Lancer les tests
        run: npx playwright test

      - name: Conserver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
